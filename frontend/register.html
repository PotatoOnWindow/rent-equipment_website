<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar"><div id="navbar"></div></nav>
    <main class="container" style="max-width: 400px;">
        <h1>Регистрация</h1>
        <form id="registerForm">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" required maxlength="20">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required maxlength="200">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required maxlength="100">
            </div>
            <button type="submit" class="btn btn-block">Зарегистрироваться</button>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const user = await API.register(data);
                UserManager.save(user);
                window.location.href = 'index.html';
            } catch (e) {
                alert('Ошибка регистрации: ' + e.message);
            }
        });
    </script>
</body>
</html>

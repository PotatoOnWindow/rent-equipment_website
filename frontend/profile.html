<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div id="navbar"></div>
    </nav>
    
    <main class="container">
        <h1>Мой профиль</h1>
        <div id="profile-info"></div>
        <h2 style="margin-top: 2rem;">Мои заказы</h2>
        <div id="orders-list"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
	<script>
	async function loadProfile() {
		console.log('loadProfile called');
    if (!AuthManager.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
    }

		async function cancelOrder(id) {
			if (!confirm('Отменить заказ?')) return;

			try {
				await API.cancelOffer(id);
				alert('Заказ отменён');
				loadProfile(); // перезагрузка списка
			} catch (e) {
				alert('Ошибка: ' + e.message);
			}
		}
    const profileInfo = document.getElementById('profile-info');
    const ordersContainer = document.getElementById('orders-list');

    let user;
    try {
        user = await API.getMe();
    } catch (e) {
        console.error('Ошибка получения пользователя:', e);
        AuthManager.logout();
        return;
    }

    // Профиль
    profileInfo.innerHTML = `
        <div class="card">
            <h3>👤 ${user.username}</h3>
            <p>📧 ${user.email}</p>
        </div>
    `;

    // Заказы
    try {
        ordersContainer.innerHTML = 'Загрузка...';

        const data = await API.getUserOffers();

        if (!data.offers || data.offers.length === 0) {
            ordersContainer.innerHTML = `
                <div class="alert alert-info">
                    Нет заказов
                    <br><br>
                    <a href="index.html">Перейти в каталог</a>
                </div>
            `;
            return;
        }

        ordersContainer.innerHTML = `
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Техника</th>
                        <th>Кол-во</th>
                        <th>Период</th>
                        <th>Стоимость</th>
                        <th>Статус</th>
			<th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.offers.map(o => `
                        <tr>
                            <td>#${o.id}</td>
                            <td>${o.machinery_type}</td>
                            <td>${o.amount}</td>
                            <td>${formatDate(o.start_date)} — ${formatDate(o.expiration_date)}</td>
                            <td>${o.total_cost} ₽</td>
                            <td>${o.status}</td>
			    <td>
			    	${o.status === 'active' ? `
					<button class="btn-danger" onclick="cancelOrder(${o.id})">
						Отменить
					</button>
				` : '—'}
			    </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    } catch (e) {
        console.error('Ошибка загрузки заказов:', e);
        ordersContainer.innerHTML = 'Ошибка загрузки заказов';
    }
}

function formatDate(dateString) {
    return new Date(dateString).toLocaleDateString('ru-RU');
}

// запуск
loadProfile();
</script>
</body>
</html>

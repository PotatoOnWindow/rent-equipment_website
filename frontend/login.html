<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar"><div id="navbar"></div></nav>
    <main class="container" style="max-width: 400px;">
        <h1>Вход</h1>
        <div id="message" class="alert alert-info" style="display: none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-block">Войти</button>
        </form>
        <p class="text-center" style="margin-top: 1rem;">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
		document.getElementById('loginForm').addEventListener('submit',async (e) => {
			e.preventDefault();

			const formData = new FormData(e.target);
			const data = Object.fromEntries(formData.entries());
			
			console.log('Submitting login: ', data);

			const submitBtn = e.target.querySelector('button[type="submit"]');
			submitBtn.disabled = true;
			submitBtn.textContent = 'Вы успешно вошли в свой аккаунт!';

			try {
				const response = await API.login(data);
				
				console.log('Login success:', response);

				// save JWT token
				AuthManager.saveToken(response.access_token);

				// redirect
				window.location.href = 'profile.html';

			} catch (e) {
				alert('Ошибка входа: ' + e.message);
				submitBtn.disabled = false;
				submitBtn.textContent = 'Войти';
			}
		});
    </script>
</body>
</html>
